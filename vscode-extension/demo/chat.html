<!doctype html>
<!-- The real TutorBot chat webview, with VS Code's webview API stubbed so the
     demo stage (the parent page) plays the extension host's part. -->
<html lang="en" class="vscode-dark"><head><meta charset="utf-8"><link rel="icon" href="data:,">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="../media/vendor/katex.min.css">
<link rel="stylesheet" href="../media/chat.css">
<title>TutorBot</title>
<script>
  window.acquireVsCodeApi = () => ({
    postMessage: (m) => window.parent.postMessage({ from: "chat", m }, "*"),
    getState: () => undefined,
    setState: () => {},
  });
</script>
</head>
<body class="vscode-dark">
<div id="app"></div>
<script src="../media/vendor/katex.min.js"></script>
<script src="../media/vendor/markdown-it.min.js"></script>
<script src="../media/vendor/highlight.min.js"></script>
<script src="../media/chat.js"></script>
</body></html>
